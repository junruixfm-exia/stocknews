{% extends "base.html" %}
{% block title %}🔥 {{ query }} · 话题聚合{% endblock %}
{% block content %}

<div id="topic-header" class="mb-4">
    <h1 class="text-lg font-bold text-gray-800">🔥 {{ query }}</h1>
    <p id="topic-info" class="text-sm text-gray-500">加载中...</p>
</div>

<div id="topic-loading" class="text-center py-12">
    <div class="animate-spin inline-block w-8 h-8 border-4 border-orange-200 border-t-orange-500 rounded-full"></div>
    <p class="text-gray-400 text-sm mt-4">正在加载话题文章...</p>
</div>

<div id="topic-articles" class="space-y-3 hidden"></div>

<div id="topic-empty" class="text-center py-20 text-gray-400 hidden">
    <div class="text-5xl mb-4">📭</div>
    <p>该话题暂无文章数据</p>
    <p class="text-xs mt-2">请先生成「AI 摘要 + 热度」后再试</p>
</div>

<script>
(async function() {
    const query = "{{ query }}";
    if (!query) return;
    
    try {
        const resp = await fetch('/api/topic/articles?q=' + encodeURIComponent(query));
        const data = await resp.json();
        
        document.getElementById('topic-loading').classList.add('hidden');
        
        // 话题信息
        if (data.topic_info) {
            document.getElementById('topic-info').innerHTML = 
                `🥇 热度 #${data.topic_info.rank} · 热度值 ${data.topic_info.heat} · ${data.total} 篇报道`;
        } else {
            document.getElementById('topic-info').textContent = `共 ${data.total} 篇相关资讯`;
        }
        
        if (data.articles && data.articles.length > 0) {
            const container = document.getElementById('topic-articles');
            container.innerHTML = data.articles.map(a => `
                <a href="/article/${a.id}" class="block bg-white rounded-lg p-4 shadow-sm article-card no-underline">
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex-1 min-w-0">
                            <h2 class="text-base font-medium text-gray-900 mb-1">${escapeHtml(a.title)}</h2>
                            ${a.summary ? `<p class="text-sm text-gray-500 line-clamp-2 mb-2">${escapeHtml(a.summary).substring(0, 120)}</p>` : ''}
                            <div class="flex flex-wrap items-center gap-2 text-xs text-gray-400">
                                <span class="source-tag bg-blue-50 text-blue-600">${escapeHtml(a.source_name || '')}</span>
                                ${a.published_at ? `<span>${(a.published_at+'').substring(0, 16).replace('T', ' ')}</span>` : ''}
                                ${(a.tags || []).slice(0, 3).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </a>
            `).join('');
            container.classList.remove('hidden');
        } else {
            document.getElementById('topic-empty').classList.remove('hidden');
        }
    } catch(e) {
        document.getElementById('topic-loading').classList.add('hidden');
        document.getElementById('topic-info').textContent = '加载失败: ' + e.message;
    }
    
    function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }
})();
</script>

{% endblock %}
